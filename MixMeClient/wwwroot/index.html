<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MixMeClient</title>
    <base href="/" />

    <!-- Подключение стилей -->
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="MixMeClient.styles.css" rel="stylesheet" />

    <!-- Библиотеки анимаций и иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- ГЛОБАЛЬНЫЙ СТИЛЬ КРАСИВОГО СКРОЛЛА -->
    <style>
        /* Настройка для браузеров Chrome, Edge, Safari */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(233, 30, 99, 0.25);
            border-radius: 10px;
            transition: 0.3s ease;
        }

            ::-webkit-scrollbar-thumb:hover {
                background: #E91E63;
                box-shadow: 0 0 10px rgba(233, 30, 99, 0.5);
            }

        /* Настройка для Firefox */
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(233, 30, 99, 0.3) rgba(0, 0, 0, 0.2);
        }
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            /* Разрешаем вертикальный скролл и убираем горизонтальный */
            overflow-x: hidden;
            overflow-y: auto;
            background: #0B0B0B; /* Цвет фона, чтобы не было белых вспышек */
        }

        #app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- Анимация загрузки при первом старте -->
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <!-- Блок отображения критических ошибок -->
    <div id="blazor-error-ui">
        Произошла непредвиденная ошибка.
        <a href="" class="reload">Обновить страницу</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- Скрипты фреймворка -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- Скрипт для интерактивного свечения курсора -->
    <script>
        window.updateCursorGlow = (x, y) => {
            const glow = document.getElementById('cursorGlow');
            if (glow) {
                // Используем requestAnimationFrame для плавной анимации (60 FPS)
                window.requestAnimationFrame(() => {
                    glow.style.left = x + 'px';
                    glow.style.top = y + 'px';
                });
            }
        };
    </script>
    <script>
        window.scrollToBottom = (elementId) => {
            const el = document.getElementById(elementId);
            if (el) { el.scrollTop = el.scrollHeight; }
        };
    </script>
</body>

</html>
